services:
  web:
    build: .
    # Apply any new migrations, then start the dev server (serves HTTP and websockets).
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Live updates go through Redis so every server process can reach every browser.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
